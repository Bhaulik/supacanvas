name = "supacanvas-share-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

# ====================================================================
# Custom domains for supacanvas.com and www.supacanvas.com are added
# via the Cloudflare dashboard (Workers & Pages → supacanvas-share-api
# → Settings → Triggers → Add Custom Domain). The dashboard handles
# the DNS-record conflict prompt that this current wrangler version
# can't override from the CLI (override_existing_dns_record requires
# wrangler 4.87+, which needs Node 22).
# ====================================================================

# ====================================================================
# Public URL of this deployment, used by the viewer for OG image links.
# ====================================================================
[vars]
PUBLIC_BASE_URL = "https://supacanvas.com"

# ====================================================================
# KV namespaces — created via:
#   wrangler kv namespace create SHARE_META
#   wrangler kv namespace create SHARE_RATELIMIT
# ====================================================================
[[kv_namespaces]]
binding = "SHARE_META"
id = "a75202179cbd49af8be6e594cda69fc2"

[[kv_namespaces]]
binding = "SHARE_RATELIMIT"
id = "085eedbdca834f6bac7cb81b49016b31"

# ====================================================================
# R2 bucket — created via:
#   wrangler r2 bucket create supacanvas-share
# ====================================================================
[[r2_buckets]]
binding = "SHARE_BUCKET"
bucket_name = "supacanvas-share"
